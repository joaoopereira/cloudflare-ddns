name: Release client

# Push a tag like v1.2.3 to build ddns-client for every supported platform,
# upload the binaries and checksums.txt to the ddns-releases R2 bucket (served
# by the Worker at /download/<version>/<asset>, which installers and remote
# upgrades use), and publish a GitHub Release with the same files.
# Requires the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
      - run: go vet ./... && go test ./...
      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/ddns-client_${os}_${arch}"
            [ "$os" = windows ] && out="$out.exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" GOARM=7 \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$out" ./cmd/ddns-client
          done
          (cd dist && sha256sum ddns-client_* > checksums.txt)
          cat dist/checksums.txt
      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ github.ref_name }}
        run: |
          for f in dist/*; do
            npx -y wrangler@4 r2 object put "ddns-releases/${VERSION}/$(basename "$f")" --file "$f" --remote
          done
          # Publish last, so "latest" never points at a half-uploaded release.
          echo "$VERSION" > dist-latest.txt
          npx -y wrangler@4 r2 object put ddns-releases/latest.txt --file dist-latest.txt --content-type text/plain --remote
      - name: Release notes
        run: npx -y git-cliff@2 --latest --strip header -o ../RELEASE_NOTES.md
        working-directory: client
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --notes-file ../RELEASE_NOTES.md
