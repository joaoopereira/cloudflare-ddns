name: Release client

# Builds ddns-client for every supported platform (in parallel), uploads the
# binaries and checksums.txt to the ddns-releases R2 bucket (served by the Worker at
# /download/<version>/<asset>, which installers and remote upgrades use), and
# publishes a GitHub Release with the same files, then deploys that release
# of the Worker and dashboard to production (deploy.yml). This is the only
# way code reaches production.
#
# Start it either way:
# - push a tag like v1.2.3, or
# - run it manually (Actions → Release client → Run workflow) with a version;
#   it then tags the selected branch itself and pushes that tag.
# Requires the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v1.2.3 (tags the selected branch)"
        required: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            VERSION="$INPUT_VERSION"
            if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::version must look like v1.2.3, got '$VERSION'"; exit 1
            fi
            if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
              echo "::error::tag $VERSION already exists"; exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "$VERSION"
            # Pushed with GITHUB_TOKEN, so it doesn't start this workflow again.
            git push origin "refs/tags/$VERSION"
          else
            VERSION="$GITHUB_REF_NAME"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # Same checks as CI, run alongside the builds; nothing is published unless
  # they pass.
  test:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.version.outputs.version }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum
      - run: go vet ./... && go test ./...

  test-server:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.version.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build dashboard
        run: npm run build:dashboard

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - linux/arm
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
          - windows/arm64
    defaults:
      run:
        working-directory: client
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.version.outputs.version }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          os="${TARGET%/*}"; arch="${TARGET#*/}"
          out="ddns-client_${os}_${arch}"
          [ "$os" = windows ] && out="$out.exe"
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" GOARM=7 \
            go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "../dist/$out" ./cmd/ddns-client
      - uses: actions/upload-artifact@v4
        with:
          name: ddns-client-${{ strategy.job-index }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [version, test, test-server, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.version.outputs.version }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ddns-client-*
          merge-multiple: true
      - name: Checksums
        run: |
          chmod +x dist/ddns-client_*
          test "$(ls dist | wc -l)" -eq 7
          (cd dist && sha256sum ddns-client_* > checksums.txt)
          cat dist/checksums.txt
      - name: Install wrangler
        run: npm install -g wrangler@4
      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pids=()
          for f in dist/*; do
            wrangler r2 object put "ddns-releases/${VERSION}/$(basename "$f")" --file "$f" --remote &
            pids+=($!)
          done
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          [ "$failed" = 0 ] || { echo "::error::an upload failed"; exit 1; }
          # Publish last, so "latest" never points at a half-uploaded release.
          echo "$VERSION" > dist-latest.txt
          wrangler r2 object put ddns-releases/latest.txt --file dist-latest.txt --content-type text/plain --remote
      - name: Release notes
        run: npx -y git-cliff@2 --latest --strip header -o RELEASE_NOTES.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" dist/* --title "$VERSION" --notes-file RELEASE_NOTES.md

  deploy:
    needs: [version, publish]
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit
