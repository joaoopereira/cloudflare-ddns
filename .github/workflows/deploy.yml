name: Deploy

# Deploys a released version (a vX.Y.Z tag) of the Worker and dashboard to
# https://ddns.example.com, after applying any pending D1 migrations.
# Production only ever runs released code: pushes to development don't deploy.
# The Release workflow calls this after publishing a release; to redeploy an
# existing release, run it manually (Actions → Deploy → Run workflow) with the
# tag.
# Requires repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# and repository variables DDNS_HOSTNAME (added to wrangler.toml as the custom
# domain) and D1_DATABASE_ID (replaces the placeholder there).
# Optional secrets DNS_API_TOKEN, ACCESS_TEAM_DOMAIN and ACCESS_AUD are copied
# into the Worker's secrets (CF_API_TOKEN, ACCESS_TEAM_DOMAIN, ACCESS_AUD) on
# every deploy, so they only ever need to be set in GitHub
# (see docs/deployment.md).

on:
  workflow_call:
    inputs:
      version:
        description: "Release tag to deploy, e.g. v1.2.3"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to deploy, e.g. v1.2.3"
        required: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DDNS_HOSTNAME: ${{ vars.DDNS_HOSTNAME }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
    steps:
      - name: Check the version is a release tag
        working-directory: .
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be a release tag like v1.2.3, got '$VERSION'"; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.version }}
          # Full history and tags, so the app version can be read from git.
          fetch-depth: 0
      - name: Check deploy prerequisites
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set; skipping deploy. See docs/deployment.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif ! printf '%s' "$DDNS_HOSTNAME" | grep -Eq '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$' \
            || ! printf '%s' "$D1_DATABASE_ID" | grep -Eq '^[0-9a-f-]{36}$'; then
            echo "::error::Set the repository variables DDNS_HOSTNAME (e.g. ddns.example.com) and D1_DATABASE_ID (the D1 database UUID). See docs/deployment.md."
            exit 1
          else
            # Serve only on the custom domain (not workers.dev) and use this account's database.
            sed -i "1i routes = [{ pattern = \"$DDNS_HOSTNAME\", custom_domain = true }]\nworkers_dev = false" ../wrangler.toml
            sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$D1_DATABASE_ID/" ../wrangler.toml
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            dashboard/package-lock.json
      - if: steps.check.outputs.ready == 'true'
        run: npm ci
      - name: Resolve app version
        if: steps.check.outputs.ready == 'true'
        run: |
          # Release tag plus the short commit, shown in the dashboard footer
          # and returned by /health.
          echo "APP_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          echo "APP_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Apply D1 migrations
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply ddns --remote
      - name: Build dashboard
        if: steps.check.outputs.ready == 'true'
        run: npm run build:dashboard
      - name: Deploy Worker
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler deploy --var "APP_VERSION:$APP_VERSION" --var "APP_COMMIT:$APP_COMMIT"
      - name: Sync Worker secrets
        if: steps.check.outputs.ready == 'true'
        env:
          DNS_API_TOKEN: ${{ secrets.DNS_API_TOKEN }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
        run: |
          put() {
            if [ -n "$2" ]; then
              printf '%s' "$2" | npx wrangler secret put "$1"
            else
              echo "::warning::$3 is not set; skipping Worker secret $1 (see docs/deployment.md)."
            fi
          }
          put CF_API_TOKEN "$DNS_API_TOKEN" DNS_API_TOKEN
          put ACCESS_TEAM_DOMAIN "$ACCESS_TEAM_DOMAIN" ACCESS_TEAM_DOMAIN
          put ACCESS_AUD "$ACCESS_AUD" ACCESS_AUD
