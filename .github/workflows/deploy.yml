name: Deploy

# Deploys the Worker and dashboard, after applying any pending D1 migrations.
#
# Production (https://ddns.example.com) only ever runs a released version (a
# vX.Y.Z tag cut from main). The Release workflow calls this after publishing
# a release; to redeploy an existing release, run it manually (Actions →
# Deploy → Run workflow) with the tag. Manual runs always target production.
# Requires repository variables DDNS_HOSTNAME (added to wrangler.toml as the
# custom domain) and D1_DATABASE_ID (replaces the placeholder there).
#
# Staging is the `staging` Wrangler environment (Worker
# cloudflare-ddns-staging, its own D1 database and hostname). CI calls this
# with environment: staging for every push to development once its checks
# pass, deploying that commit. It needs repository variables STAGING_HOSTNAME
# and STAGING_D1_DATABASE_ID and skips with a warning until both are set.
#
# Both need repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Optional secrets DNS_API_TOKEN, ACCESS_TEAM_DOMAIN and ACCESS_AUD are copied
# into the Worker's secrets (CF_API_TOKEN, ACCESS_TEAM_DOMAIN, ACCESS_AUD) on
# every deploy, so they only ever need to be set in GitHub
# (see docs/deployment.md).

on:
  workflow_call:
    inputs:
      environment:
        description: "production (needs version) or staging (deploys the calling commit)"
        type: string
        default: production
      version:
        description: "Release tag to deploy to production, e.g. v1.2.3"
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to deploy, e.g. v1.2.3"
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      ENVIRONMENT: ${{ inputs.environment || 'production' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DDNS_HOSTNAME: ${{ vars.DDNS_HOSTNAME }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      STAGING_HOSTNAME: ${{ vars.STAGING_HOSTNAME }}
      STAGING_D1_DATABASE_ID: ${{ vars.STAGING_D1_DATABASE_ID }}
    steps:
      - name: Check the version is a release tag
        working-directory: .
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$ENVIRONMENT" = staging ]; then exit 0; fi
          if [ "$ENVIRONMENT" != production ]; then
            echo "::error::environment must be production or staging, got '$ENVIRONMENT'"; exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be a release tag like v1.2.3, got '$VERSION'"; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          # Production: the release tag. Staging: the commit that called us.
          ref: ${{ env.ENVIRONMENT == 'production' && format('refs/tags/{0}', inputs.version) || '' }}
          # Full history and tags, so the app version can be read from git.
          fetch-depth: 0
      - name: Check deploy prerequisites
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set; skipping deploy. See docs/deployment.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ "$ENVIRONMENT" = staging ] && { [ -z "$STAGING_HOSTNAME" ] || [ -z "$STAGING_D1_DATABASE_ID" ]; }; then
            echo "::warning::STAGING_HOSTNAME / STAGING_D1_DATABASE_ID variables are not set; skipping the staging deploy. See docs/deployment.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ "$ENVIRONMENT" = staging ]; then
            if ! printf '%s' "$STAGING_HOSTNAME" | grep -Eq '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$' \
              || ! printf '%s' "$STAGING_D1_DATABASE_ID" | grep -Eq '^[0-9a-f-]{36}$'; then
              echo "::error::STAGING_HOSTNAME must be a hostname and STAGING_D1_DATABASE_ID a D1 database UUID. See docs/deployment.md."
              exit 1
            fi
            # Bindings and vars aren't inherited by Wrangler environments, so
            # staging repeats them: its own database and rate-limit namespace,
            # the shared releases bucket, on its own custom domain only.
            releases_repo=$(grep '^RELEASES_REPO' ../wrangler.toml)
            cat >> ../wrangler.toml <<EOF

          [env.staging]
          routes = [{ pattern = "$STAGING_HOSTNAME", custom_domain = true }]
          workers_dev = false

          [env.staging.vars]
          $releases_repo

          [[env.staging.d1_databases]]
          binding = "DB"
          database_name = "ddns-staging"
          database_id = "$STAGING_D1_DATABASE_ID"
          migrations_dir = "server/migrations"

          [[env.staging.r2_buckets]]
          binding = "RELEASES"
          bucket_name = "ddns-releases"

          [[env.staging.ratelimits]]
          name = "REGISTER_LIMITER"
          namespace_id = "1002"
          simple = { limit = 5, period = 60 }
          EOF
            echo "WRANGLER_ENV=--env=staging" >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif ! printf '%s' "$DDNS_HOSTNAME" | grep -Eq '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$' \
            || ! printf '%s' "$D1_DATABASE_ID" | grep -Eq '^[0-9a-f-]{36}$'; then
            echo "::error::Set the repository variables DDNS_HOSTNAME (e.g. ddns.example.com) and D1_DATABASE_ID (the D1 database UUID). See docs/deployment.md."
            exit 1
          else
            # Serve only on the custom domain (not workers.dev) and use this account's database.
            sed -i "1i routes = [{ pattern = \"$DDNS_HOSTNAME\", custom_domain = true }]\nworkers_dev = false" ../wrangler.toml
            sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$D1_DATABASE_ID/" ../wrangler.toml
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            dashboard/package-lock.json
      - if: steps.check.outputs.ready == 'true'
        run: npm ci
      - name: Resolve app version
        if: steps.check.outputs.ready == 'true'
        run: |
          # Release tag (staging: git describe, e.g. v1.3.0-4-gabc1234) plus
          # the short commit, shown in the dashboard footer and returned by /health.
          if [ "$ENVIRONMENT" = staging ]; then
            echo "APP_VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          fi
          echo "APP_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Apply D1 migrations
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --remote $WRANGLER_ENV
      - name: Build dashboard
        if: steps.check.outputs.ready == 'true'
        run: npm run build:dashboard
      - name: Deploy Worker
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler deploy $WRANGLER_ENV --var "APP_VERSION:$APP_VERSION" --var "APP_COMMIT:$APP_COMMIT"
      - name: Sync Worker secrets
        if: steps.check.outputs.ready == 'true'
        env:
          DNS_API_TOKEN: ${{ secrets.DNS_API_TOKEN }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
        run: |
          put() {
            if [ -n "$2" ]; then
              printf '%s' "$2" | npx wrangler secret put "$1" $WRANGLER_ENV
            else
              echo "::warning::$3 is not set; skipping Worker secret $1 (see docs/deployment.md)."
            fi
          }
          put CF_API_TOKEN "$DNS_API_TOKEN" DNS_API_TOKEN
          put ACCESS_TEAM_DOMAIN "$ACCESS_TEAM_DOMAIN" ACCESS_TEAM_DOMAIN
          put ACCESS_AUD "$ACCESS_AUD" ACCESS_AUD
