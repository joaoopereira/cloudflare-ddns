name: Deploy

# Deploys the Worker to https://ddns.apps.joaoopereira.com on every push to
# the default branch, after applying any pending D1 migrations.
# Requires repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# (see docs/deployment.md).

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy prerequisites
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set; skipping deploy. See docs/deployment.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif grep -q REPLACE_WITH_D1_DATABASE_ID wrangler.toml; then
            echo "::warning::wrangler.toml still has the placeholder D1 database_id; skipping deploy. See docs/deployment.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - if: steps.check.outputs.ready == 'true'
        run: npm ci
      - name: Apply D1 migrations
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply ddns --remote
      - name: Deploy Worker
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler deploy
