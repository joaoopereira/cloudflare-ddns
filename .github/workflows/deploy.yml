name: Deploy

# Deploys the Worker to https://ddns.apps.joaoopereira.com on every push to
# the default branch, after applying any pending D1 migrations.
# Requires repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Optional secrets DNS_API_TOKEN, ACCESS_TEAM_DOMAIN and ACCESS_AUD are copied
# into the Worker's secrets (CF_API_TOKEN, ACCESS_TEAM_DOMAIN, ACCESS_AUD) on
# every deploy, so they only ever need to be set in GitHub
# (see docs/deployment.md).

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy prerequisites
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set; skipping deploy. See docs/deployment.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif grep -q REPLACE_WITH_D1_DATABASE_ID wrangler.toml; then
            echo "::warning::wrangler.toml still has the placeholder D1 database_id; skipping deploy. See docs/deployment.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            dashboard/package-lock.json
      - if: steps.check.outputs.ready == 'true'
        run: npm ci
      - name: Apply D1 migrations
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply ddns --remote
      - name: Build dashboard
        if: steps.check.outputs.ready == 'true'
        run: npm run build:dashboard
      - name: Deploy Worker
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler deploy
      - name: Sync Worker secrets
        if: steps.check.outputs.ready == 'true'
        env:
          DNS_API_TOKEN: ${{ secrets.DNS_API_TOKEN }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
        run: |
          put() {
            if [ -n "$2" ]; then
              printf '%s' "$2" | npx wrangler secret put "$1"
            else
              echo "::warning::$3 is not set; skipping Worker secret $1 (see docs/deployment.md)."
            fi
          }
          put CF_API_TOKEN "$DNS_API_TOKEN" DNS_API_TOKEN
          put ACCESS_TEAM_DOMAIN "$ACCESS_TEAM_DOMAIN" ACCESS_TEAM_DOMAIN
          put ACCESS_AUD "$ACCESS_AUD" ACCESS_AUD
